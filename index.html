<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工业缺陷检测 · 案例展示</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/lucide.min.js"></script>
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon"><i data-lucide="scan-line"></i></span><div><strong>工业缺陷检测</strong><span>案例展示 / Wave-MambaAD</span></div></div>
    <div class="dataset"><span class="status-dot"></span>MVTec AD <span class="divider"></span><span>15 类 · 75 组案例</span></div>
    <button class="icon-button" id="fullscreen" title="全屏展示" aria-label="全屏展示"><i data-lucide="maximize"></i></button>
  </header>
  <div class="workspace">
    <aside class="sidebar" aria-label="产品类别">
      <div class="sidebar-heading"><span>产品类别</span><span class="count">15</span></div>
      <nav id="categories"></nav>
      <div class="sidebar-footer"><i data-lucide="images"></i><span>225 张独立图像<br><small>原图 · 热力图 · 人工标注</small></span></div>
    </aside>
    <main>
      <div class="page-heading">
        <div><div class="eyebrow">检测案例库</div><h1><span id="category-title">瓶子</span><span id="category-en">bottle</span></h1></div>
        <div class="case-count"><strong id="result-count">5</strong><span>组案例</span></div>
      </div>
      <div class="toolbar">
        <div class="tabs" role="tablist" aria-label="展示视图">
          <button role="tab" aria-selected="true" id="compare-tab" aria-controls="comparison"><i data-lucide="columns-3"></i>三图对照</button>
          <button role="tab" aria-selected="false" id="overview-tab" aria-controls="overview"><i data-lucide="layout-grid"></i>类别总览</button>
        </div>
        <div class="filters">
          <label class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="搜索类别、缺陷或编号" aria-label="搜索类别、缺陷或编号"></label>
          <select id="defect-filter" aria-label="筛选缺陷类型"><option value="">全部缺陷类型</option></select>
        </div>
      </div>
      <div id="empty" hidden><i data-lucide="search-x"></i><h2>没有匹配的案例</h2><p>请调整搜索条件。</p><button id="reset" class="action-button">清除筛选</button></div>
      <section id="comparison" role="tabpanel" aria-labelledby="compare-tab">
        <div class="sample-heading">
          <div class="sample-identity"><span class="sample-number" id="sample-number">01</span><div><h2 id="defect-title"></h2><span id="sample-detail"></span></div></div>
          <div class="sample-actions"><span id="position" aria-live="polite"></span><button id="previous" class="icon-button" title="上一组" aria-label="上一组"><i data-lucide="chevron-left"></i></button><button id="next" class="icon-button" title="下一组" aria-label="下一组"><i data-lucide="chevron-right"></i></button><button id="play" class="icon-button" title="自动播放" aria-label="自动播放" aria-pressed="false"><i data-lucide="play"></i></button></div>
        </div>
        <div class="comparison-grid" id="panels"></div>
        <div class="image-notes">
          <span><span class="red-dot"></span>红色区域为数据集人工真值标注</span>
          <div class="scale"><span>异常分数</span><span id="scale-min"></span><span class="color-scale"></span><span id="scale-max"></span></div>
        </div>
        <div class="strip-heading"><h3>当前类别案例</h3><span id="resolution"></span></div>
        <div class="sample-strip" id="sample-strip"></div>
      </section>
      <section id="overview" hidden role="tabpanel" aria-labelledby="overview-tab">
        <div class="overview-heading"><h2 id="overview-title"></h2><a id="overview-download" class="icon-button" download title="下载类别总览" aria-label="下载类别总览"><i data-lucide="download"></i></a></div>
        <div id="overview-rows"></div>
      </section>
      <footer class="main-footer"><span>Wave-MambaAD <span class="footer-separator">/</span> 第 100 轮检测结果</span><span>色阶在同一类别内一致，各类别分别归一化。</span></footer>
    </main>
  </div>
  <dialog id="lightbox" aria-labelledby="viewer-title">
    <div class="viewer-header"><div><strong id="viewer-title"></strong><span id="viewer-subtitle"></span></div><button id="close-viewer" class="icon-button" aria-label="关闭大图" title="关闭大图"><i data-lucide="x"></i></button></div>
    <div class="viewer-stage" id="viewer-stage"><img id="viewer-image" alt=""></div>
    <div class="viewer-controls"><button id="viewer-previous" class="icon-button" title="上一张" aria-label="上一张"><i data-lucide="chevron-left"></i></button><span id="viewer-position"></span><button id="viewer-next" class="icon-button" title="下一张" aria-label="下一张"><i data-lucide="chevron-right"></i></button><span class="divider"></span><i data-lucide="zoom-in"></i><input id="zoom" type="range" min="100" max="300" step="25" value="100" aria-label="图像缩放"><output id="zoom-value">100%</output><a id="viewer-download" class="icon-button" download title="下载原尺寸图片" aria-label="下载原尺寸图片"><i data-lucide="download"></i></a></div>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
